{% extends 'base.html' %}

{% block content %}

<style>

.delete-container{
width:40%;
margin:auto;
margin-top:60px;
}

.delete-card{
background:white;
border:1px solid #ddd;
border-radius:10px;
padding:30px;
text-align:center;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.delete-card h2{
color:#333;
margin-bottom:20px;
}

.btn{
padding:10px 20px;
border:none;
border-radius:5px;
cursor:pointer;
margin:10px;
}

.delete-btn{
background:#dc3545;
color:white;
}

.cancel-btn{
background:#6c757d;
color:white;
text-decoration:none;
padding:10px 20px;
border-radius:5px;
}

</style>


<div class="delete-container">

<div class="delete-card">

<h2>⚠ Are you sure you want to delete this post?</h2>

<p><strong>{{ post.Title }}</strong></p>

<form method="POST">
{% csrf_token %}

<button class="btn delete-btn" type="submit">
Yes, Delete
</button>

<a href="{% url 'index' %}" class="cancel-btn">
Cancel
</a>

</form>

</div>

</div>

{% endblock %}
